[package]
name = "pathtracer"
version = "0.1.0"
authors = ["kishore-ganesh <kishore2912000@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra-glm="0.10.0"
rand = "0.9.2"
console = { version = "0.16.0", default-features = false, features = ["std"] }
indicatif = "0.16.2"
obj-rs = "0.7.0"
log = {version = "0.4.29"}
env_logger = "0.11.8"
gltf = {version = "1.4.1", features = ["names", "KHR_materials_emissive_strength", "KHR_materials_specular", "KHR_lights_punctual"]}

